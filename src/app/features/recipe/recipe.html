<div class="wrapper">
  <section class="hero">
    <h1 class="header">Explore our simple, healthy recipes</h1>
    <p>
      Discover eight quick, whole-food dishes that fit real-life schedules and taste amazing. Use
      the search bar to find a recipe by name or ingredient, or simply scroll the list and let
      something delicious catch your eye.
    </p>
  </section>

  <section class="recipe-section">
    <div class="recipe-filters">
      
      <app-prep-time-component
        (prepTimeChanged)="filterPrepTime($event)"
        (clearFilter)="clear()"
      ></app-prep-time-component>
      <app-cooking-time-component
        (cookTimeChanged)="filterCookingTime($event)"
        (clearFilter)="clear()"
      ></app-cooking-time-component>
      <div class="search__container">
        <img src="assets/images/icon-search.svg" alt="" /><input
          type="text"
          placeholder="Search by name or ingredient…"
          [(ngModel)]="searchTerm"
          (input)="onSearch()"
        />
      </div>
    </div>

    <div class="recipe-grid">
      @for (recipe of recipes; track $index) {
        <app-recipe-card [recipe]="recipe"></app-recipe-card>
      }
    </div>
  </section>
</div>
